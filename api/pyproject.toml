[project]
name = "pdf24-ocr-api"
version = "0.2.0"
description = "Unofficial HTTP wrapper around PDF24's public OCR service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PDF24 OCR API" }]
keywords = ["ocr", "pdf", "pdf24", "fastapi", "async"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
