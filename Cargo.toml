[package]
name = "pdf24-ocr-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
anyhow = "1.0"
regex = "1.10"
rand = "0.8"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
pathdiff = "0.2"
